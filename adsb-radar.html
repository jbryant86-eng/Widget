<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#050d1a" />
<title>OVERHEAD // ADS-B</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050d1a;
    --surface: #0a1628;
    --green: #00ff88;
    --green-dim: #00ff8840;
    --green-faint: #00ff8812;
    --amber: #ffb800;
    --red: #ff3c5a;
    --text: #c8ddf0;
    --muted: #4a6580;
    --sweep-ms: 3000ms;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    height: 100%;
    overflow: hidden;
    user-select: none;
  }

  #root {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 420px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
    border-bottom: 1px solid #0d2240;
    flex-shrink: 0;
  }
  .header-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  .status-dot.offline { background: var(--muted); box-shadow: none; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* RADAR */
  .radar-wrap {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px 16px 8px;
  }
  .radar-container {
    position: relative;
    width: min(320px, 90vw);
    height: min(320px, 90vw);
  }
  canvas#radar {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border-radius: 50%;
  }
  .radar-overlay-info {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 14px;
    pointer-events: none;
  }
  .radar-range-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    justify-content: space-around;
    padding: 10px 16px;
    border-top: 1px solid #0d2240;
    border-bottom: 1px solid #0d2240;
    flex-shrink: 0;
  }
  .stat {
    text-align: center;
  }
  .stat-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    color: var(--green);
    text-shadow: 0 0 12px var(--green);
    line-height: 1;
  }
  .stat-val.amber { color: var(--amber); text-shadow: 0 0 12px var(--amber); }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-top: 2px;
    text-transform: uppercase;
  }

  /* FLIGHT LIST */
  .flight-list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px 6px;
    flex-shrink: 0;
  }
  .flight-list-title {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .refresh-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--green);
    background: transparent;
    border: 1px solid var(--green-dim);
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .refresh-btn:active { background: var(--green-faint); }
  .refresh-btn:disabled { color: var(--muted); border-color: #1a2a3a; }

  .flight-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px 16px;
    scrollbar-width: none;
  }
  .flight-list::-webkit-scrollbar { display: none; }

  .flight-card {
    display: grid;
    grid-template-columns: 80px 1fr auto;
    gap: 4px 12px;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: var(--surface);
    border: 1px solid #0d2240;
    border-left: 3px solid var(--green-dim);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    animation: fadeIn 0.3s ease;
  }
  .flight-card:active { background: #0d1e38; border-left-color: var(--green); }
  .flight-card.selected { border-left-color: var(--green); background: #0d1e38; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .flight-callsign {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    color: var(--green);
    letter-spacing: 0.05em;
  }
  .flight-route {
    font-size: 12px;
    color: var(--text);
    letter-spacing: 0.05em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .flight-alt {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--amber);
    text-align: right;
  }
  .flight-speed {
    font-size: 11px;
    color: var(--muted);
    grid-column: 2;
  }
  .flight-dist {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 32px 20px;
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    line-height: 2;
    letter-spacing: 0.1em;
  }

  .location-prompt {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 32px;
    text-align: center;
    z-index: 10;
  }
  .location-prompt h2 {
    font-size: 20px;
    letter-spacing: 0.15em;
    color: var(--green);
    font-weight: 700;
  }
  .location-prompt p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    letter-spacing: 0.05em;
  }
  .allow-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--bg);
    background: var(--green);
    border: none;
    padding: 14px 32px;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 20px var(--green-dim);
  }

  /* DETAIL PANEL */
  .detail-panel {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: min(420px, 100vw);
    background: #0a1628;
    border-top: 2px solid var(--green-dim);
    border-radius: 16px 16px 0 0;
    padding: 20px 20px 32px;
    transition: transform 0.3s cubic-bezier(.2,.8,.4,1);
    z-index: 20;
  }
  .detail-panel.open {
    transform: translateX(-50%) translateY(0);
  }
  .detail-handle {
    width: 36px; height: 4px;
    background: #1a3050;
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .detail-callsign {
    font-family: 'Share Tech Mono', monospace;
    font-size: 28px;
    color: var(--green);
    text-shadow: 0 0 20px var(--green);
    margin-bottom: 4px;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .detail-field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .detail-field span {
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    color: var(--text);
  }
  .detail-close {
    position: absolute;
    top: 16px; right: 16px;
    background: transparent;
    border: 1px solid #1a3050;
    color: var(--muted);
    font-size: 18px;
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .update-time {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    text-align: center;
    padding: 4px;
    letter-spacing: 0.1em;
  }
  .error-bar {
    font-size: 11px;
    color: var(--red);
    text-align: center;
    padding: 6px;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
// ── CONFIG ──────────────────────────────────────────────────────────────────
const RADIUS_NM = 25; // nautical miles radius
const NM_TO_DEG = 1 / 60;
const REFRESH_MS = 15000;

// ── STATE ────────────────────────────────────────────────────────────────────
let location = null;
let flights = [];
let selectedFlight = null;
let lastUpdate = null;
let error = null;
let loading = false;
let sweepAngle = 0;
let animFrame;
let refreshTimer;

// ── HELPERS ──────────────────────────────────────────────────────────────────
function distNM(lat1, lon1, lat2, lon2) {
  const R = 3440.065; // NM
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function bearingDeg(lat1, lon1, lat2, lon2) {
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) - Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function fmtAlt(m) {
  if (m == null) return '—';
  return Math.round(m * 3.28084 / 100) * 100 + ' ft';
}
function fmtSpeed(ms) {
  if (ms == null) return '—';
  return Math.round(ms * 1.94384) + ' kt';
}
function fmtDist(nm) {
  return nm.toFixed(1) + ' NM';
}
function fmtTime(d) {
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ── FETCH FLIGHTS ─────────────────────────────────────────────────────────────
async function fetchFlights() {
  if (!location || loading) return;
  loading = true;
  error = null;
  render();

  const { lat, lon } = location;
  const deg = RADIUS_NM * NM_TO_DEG;
  const url = `https://opensky-network.org/api/states/all?lamin=${lat-deg}&lomin=${lon-deg}&lamax=${lat+deg}&lomax=${lon+deg}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const states = data.states || [];

    flights = states
      .filter(s => s[5] != null && s[6] != null)
      .map(s => ({
        icao: s[0],
        callsign: (s[1] || '').trim() || s[0].toUpperCase(),
        country: s[2],
        lon: s[5],
        lat: s[6],
        alt: s[7],       // meters geo alt
        baro: s[13],     // baro alt meters
        vel: s[9],       // m/s
        hdg: s[10],
        vrate: s[11],
        onGround: s[8],
      }))
      .filter(f => !f.onGround)
      .map(f => ({
        ...f,
        dist: distNM(lat, lon, f.lat, f.lon),
        bearing: bearingDeg(lat, lon, f.lat, f.lon),
      }))
      .sort((a, b) => a.dist - b.dist);

    lastUpdate = new Date();
  } catch (e) {
    error = 'Could not reach OpenSky — check connection';
    console.error(e);
  }

  loading = false;
  render();
}

// ── RADAR CANVAS ──────────────────────────────────────────────────────────────
function drawRadar(canvas) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.offsetWidth;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const cx = size / 2, cy = size / 2, r = size / 2;

  // bg
  ctx.fillStyle = '#020912';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

  // rings
  [0.25, 0.5, 0.75, 1].forEach(f => {
    ctx.beginPath();
    ctx.arc(cx, cy, r * f, 0, Math.PI * 2);
    ctx.strokeStyle = '#0d2240';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // crosshairs
  ctx.strokeStyle = '#0d2240';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.stroke();

  // sweep gradient
  const sweepRad = sweepAngle * Math.PI / 180;
  const grad = ctx.createConicalGradient
    ? null
    : null;

  // Draw sweep as arc fill
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(sweepRad - Math.PI/2);
  const sweepGrad = ctx.createLinearGradient(0, 0, r, 0);
  sweepGrad.addColorStop(0, '#00ff8830');
  sweepGrad.addColorStop(1, '#00ff8800');
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, r, -0.5, 0.3);
  ctx.closePath();
  ctx.fillStyle = sweepGrad;
  ctx.fill();
  // sweep line
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(r, 0);
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  // flights
  if (location) {
    flights.forEach(f => {
      const bearing = f.bearing * Math.PI / 180;
      const dist = f.dist;
      const normDist = Math.min(dist / RADIUS_NM, 1);
      const px = cx + normDist * r * Math.sin(bearing);
      const py = cy - normDist * r * Math.cos(bearing);

      const isSelected = selectedFlight?.icao === f.icao;
      const color = isSelected ? '#ffb800' : '#00ff88';

      // glow
      ctx.beginPath();
      ctx.arc(px, py, isSelected ? 8 : 5, 0, Math.PI*2);
      ctx.fillStyle = isSelected ? '#ffb80020' : '#00ff8820';
      ctx.fill();

      // dot
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI*2);
      ctx.fillStyle = color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = color;
      ctx.fill();
      ctx.shadowBlur = 0;

      // heading tick
      if (f.hdg != null) {
        const hdgRad = f.hdg * Math.PI / 180;
        const tx = px + Math.sin(hdgRad) * 8;
        const ty = py - Math.cos(hdgRad) * 8;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(tx, ty);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // callsign label for nearby
      if (dist < RADIUS_NM * 0.5 || isSelected) {
        ctx.fillStyle = color;
        ctx.font = '8px Share Tech Mono';
        ctx.fillText(f.callsign.substring(0,8), px + 6, py - 4);
      }
    });

    // center dot (you)
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#fff';
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  document.title = `OVERHEAD // ${flights.length} AIRCRAFT`;
  const root = document.getElementById('root');

  if (!location) {
    root.innerHTML = `
      <div class="location-prompt">
        <h2>OVERHEAD // ADS-B</h2>
        <p>Grant location access to see aircraft flying above you in real time using ADS-B transponder data.</p>
        <button class="allow-btn" id="allow-btn">ENABLE LOCATION</button>
      </div>`;
    document.getElementById('allow-btn').onclick = requestLocation;
    return;
  }

  const maxAlt = flights[0] ? Math.max(...flights.map(f => f.baro || f.alt || 0)) : 0;
  const closest = flights[0];

  root.innerHTML = `
    <div class="header">
      <div>
        <div class="header-title">OVERHEAD // ADS-B RADAR</div>
      </div>
      <div class="status-dot ${loading ? 'offline' : ''}"></div>
    </div>

    <div class="radar-wrap">
      <div class="radar-container">
        <canvas id="radar"></canvas>
        <div class="radar-overlay-info">
          <span class="radar-range-label">${RADIUS_NM} NM RANGE</span>
        </div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-val">${flights.length}</div>
        <div class="stat-label">AIRCRAFT</div>
      </div>
      <div class="stat">
        <div class="stat-val amber">${closest ? fmtDist(closest.dist) : '—'}</div>
        <div class="stat-label">NEAREST</div>
      </div>
      <div class="stat">
        <div class="stat-val">${maxAlt ? (Math.round((maxAlt * 3.28084) / 1000)) + 'k' : '—'}</div>
        <div class="stat-label">MAX ALT FT</div>
      </div>
    </div>

    <div class="flight-list-header">
      <span class="flight-list-title">TRAFFIC</span>
      <button class="refresh-btn" id="refresh-btn" ${loading ? 'disabled' : ''}>${loading ? 'SCANNING...' : '↻ REFRESH'}</button>
    </div>

    ${error ? `<div class="error-bar">${error}</div>` : ''}

    <div class="flight-list" id="flight-list">
      ${flights.length === 0 && !loading ? '<div class="empty-state">NO AIRCRAFT DETECTED<br/>IN RANGE</div>' : ''}
      ${flights.slice(0, 30).map(f => `
        <div class="flight-card ${selectedFlight?.icao === f.icao ? 'selected' : ''}" data-icao="${f.icao}">
          <div class="flight-callsign">${f.callsign}</div>
          <div class="flight-route">${f.country}</div>
          <div class="flight-alt">${fmtAlt(f.baro || f.alt)}</div>
          <div class="flight-speed">${fmtSpeed(f.vel)} · ${Math.round(f.bearing)}°</div>
          <div class="flight-dist">${fmtDist(f.dist)}</div>
        </div>`).join('')}
    </div>

    ${lastUpdate ? `<div class="update-time">LAST UPDATE ${fmtTime(lastUpdate)}</div>` : ''}

    ${selectedFlight ? `
    <div class="detail-panel open" id="detail-panel">
      <div class="detail-handle"></div>
      <button class="detail-close" id="detail-close">✕</button>
      <div class="detail-callsign">${selectedFlight.callsign}</div>
      <div style="font-size:11px;color:var(--muted);letter-spacing:.1em">${selectedFlight.icao.toUpperCase()} · ${selectedFlight.country}</div>
      <div class="detail-grid">
        <div class="detail-field"><label>ALTITUDE</label><span>${fmtAlt(selectedFlight.baro || selectedFlight.alt)}</span></div>
        <div class="detail-field"><label>SPEED</label><span>${fmtSpeed(selectedFlight.vel)}</span></div>
        <div class="detail-field"><label>HEADING</label><span>${selectedFlight.hdg != null ? Math.round(selectedFlight.hdg) + '°' : '—'}</span></div>
        <div class="detail-field"><label>VERT RATE</label><span>${selectedFlight.vrate != null ? (selectedFlight.vrate > 0 ? '▲' : '▼') + ' ' + Math.abs(Math.round(selectedFlight.vrate * 196.85)) + ' ft/m' : '—'}</span></div>
        <div class="detail-field"><label>DISTANCE</label><span>${fmtDist(selectedFlight.dist)}</span></div>
        <div class="detail-field"><label>BEARING</label><span>${Math.round(selectedFlight.bearing)}°</span></div>
      </div>
    </div>` : ''}
  `;

  // bind events
  document.getElementById('refresh-btn')?.addEventListener('click', fetchFlights);
  document.getElementById('detail-close')?.addEventListener('click', () => {
    selectedFlight = null; render();
  });
  document.querySelectorAll('.flight-card').forEach(card => {
    card.addEventListener('click', () => {
      const icao = card.dataset.icao;
      selectedFlight = flights.find(f => f.icao === icao) || null;
      render();
    });
  });

  // draw radar
  const canvas = document.getElementById('radar');
  if (canvas) drawRadar(canvas);
}

// ── ANIMATION LOOP ────────────────────────────────────────────────────────────
function animate(ts) {
  sweepAngle = (ts / 10) % 360;
  const canvas = document.getElementById('radar');
  if (canvas && location) drawRadar(canvas);
  animFrame = requestAnimationFrame(animate);
}

// ── LOCATION ──────────────────────────────────────────────────────────────────
function requestLocation() {
  navigator.geolocation.getCurrentPosition(pos => {
    location = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    render();
    fetchFlights();
    refreshTimer = setInterval(fetchFlights, REFRESH_MS);
  }, err => {
    console.error(err);
    alert('Location access denied. This app requires your location to show nearby aircraft.');
  }, { enableHighAccuracy: false });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
render();
requestAnimationFrame(animate);
</script>
</body>
</html>
